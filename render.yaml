# Render Blueprint: deploy the compendium as a pure static site (no backend).
# The frontend build generates personas.json from the TSV, so the dist/ bundle
# is fully self-contained. Security headers mirror the old FastAPI middleware.
services:
  - type: web
    name: persona-compendium
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    # client-side routing: serve real files, fall back to the SPA shell
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; frame-ancestors 'none';
          object-src 'none'; script-src 'self';
          style-src 'self';
          font-src 'self'; img-src 'self' data:; connect-src 'self';
          form-action 'self'
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      # fingerprinted assets are immutable: cache hard in the browser so repeat
      # visits skip revalidation (HTML stays uncached to pick up new bundles)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # .webmanifest has no built-in MIME on the static host (served as
      # octet-stream); set the spec type so browsers accept the manifest
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json
